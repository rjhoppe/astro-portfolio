version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    assignees:
      - "rickjhoppe"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      drizzle:
        patterns:
          - "drizzle-*"
      astro-ecosystem:
        patterns:
          - "@astrojs/*"
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
          - "@vitejs/plugin-react"
      testing-ecosystem:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
      sentry-ecosystem:
        patterns:
          - "@sentry/*"
    ignore:
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "rickjhoppe"
    labels:
      - "ci"
      - "github-actions"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "rickjhoppe"
    labels:
      - "docker"
    commit-message:
      prefix: "docker"
