version: 2
updates:
  # This covers npm, yarn, and pnpm based on your lockfile
  - package-ecosystem: "npm" 
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    # Grouping related updates into single PRs to reduce noise
    groups:
      drizzle:
        patterns:
          - "drizzle-*"
      astro-ecosystem:
        patterns:
          - "@astrojs/*"
    ignore:
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep this only if you have a Dockerfile in your root
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"